name: Update generated data

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build generated data
        run: npm run build:data

      - name: Check career data quality
        run: npm run check:career

      - name: Verify app build
        run: npm run build

      - name: Commit generated data
        run: |
          if [ -n "$(git status --porcelain public/data/players.json public/data/squadPools.json data/generated data/raw)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/players.json public/data/squadPools.json data/generated data/raw
            git commit -m "chore: update generated squad pools"
            git push
          else
            echo "No generated data changes."
          fi
